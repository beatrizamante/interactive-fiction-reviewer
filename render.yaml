services:
  - type: web
    name: if-reads-backend
    runtime: node
    rootDir: ifReads
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1h
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
